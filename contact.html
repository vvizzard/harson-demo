Harson Group accompagne l’Union Européenne dans la communication et l’organisation d’événements autour des thématiques liées à l’environnement des affaires, à l’industrialisation et à la facilitation des échanges commerciaux à Madagascar. Parmi les temps forts, Harson assure l’organisation de la Semaine de l’Europe chaque mois de mai (2024, 2025, 2026), la réunion annuelle de la Plateforme des Partenaires Techniques et Financiers, ainsi que diverses rencontres thématiques (ateliers, conférences, sessions d’information) à l’attention du secteur privé européen et des parties prenantes malgaches.","imgs":["2025/06/UE1.jpg","2025/06/ue2.jpg","2025/06/UE3.jpg","2025/06/UE4.jpg"]},{"slug":"organisation-de-la-journee-mondiale-de-la-telecommunication","year":"2024","title":"Organisation de la Journée Mondiale de la Télécommunication à Madagascar","family":"evenementiel","desc":"Harson Group a organisé la Journée Mondiale de la Télécommunication à Madagascar, en partenariat avec le Ministère du Développement Numérique, des Postes et des Télécommunications (MNDPT). L’événement a réuni des invités internationaux. Harson Group a assuré la planification et la coordination générale, l’organisation des rencontres B2B, le suivi avec les différentes commissions, la mise en œuvre du plan de communication, ainsi que l’animation de l’événement. L’entreprise a également géré les aspects techniques, dont la sonorisation et la diffusion en direct, et a réalisé le suivi, le reporting et l’évaluation post-événement.","imgs":["2025/06/MNDTP1.png"]},{"slug":"organisation-de-b2b-mise-en-place-et-gestion","year":"2024","title":"Organisation de B2B, mise en place et gestion du stand MIONJO durant la COP 29","family":"promotion","desc":"Dans le cadre de la participation du projet MIONJO à la COP 29, Harson Group a assuré la planification et la coordination générale des activités menées à Bakou. L’événement, soutenu par la Banque mondiale, a réuni des délégations de presque tous les pays et permis l’organisation de 80 rencontres B2B pertinentes. Harson Group a pris en charge la gestion de l’hébergement, la préparation logistique des rencontres B2B, la coordination du stand d’exposition, la production de supports promotionnels, ainsi que l’aménagement technique et visuel du stand. Un suivi rigoureux, des rapports et une évaluation post-événement ont été réalisés pour garantir la performance et la visibilité du projet MIONJO.","imgs":["2025/06/mionjo2.jpg","2025/06/mionjo1.jpg"]},{"slug":"organisation-du-colloque-international-sur-le-financement-des","year":"2024","title":"Organisation du Colloque International sur le Financement des Collectivités","family":"evenementiel","desc":"Harson Group a assuré l’organisation logistique du Colloque International sur les mécanismes innovants de financement des collectivités. L’événement, co-organisé par le MDAT et le RIAFCO, a réuni des invités internationaux issus de 15 pays. L’entreprise a pris en charge la coordination générale, la communication, les animations officielles et les aspects techniques, contribuant au bon déroulement de l’ensemble de l’événement.","imgs":["2025/06/colloque1.png","2025/06/colloque-2.jpg","2025/06/colloque3.jpg"]},{"slug":"communication-sur-les-nouvelles-reglementations-europeennes","year":"2023-2024","title":"Communication sur les nouvelles réglementations européennes","family":"communication","desc":"HARSON Group a organisé des ateliers d’échanges et de travail entre la Délégation de l’Union européenne et le secteur privé de Madagascar. Il a assuré l’organisation logistique et la modération avec un focus sur les nouvelles règlementations de l’Union européenne sur les produits agricoles, particulièrement sur la vanille ainsi que la mise en œuvre du règlement de l’Union européenne relatif aux produits « zéro déforestation », entré en vigueur le 29 juin 2023.","imgs":["2024/07/DSC09638.jpg","2024/07/DSC09852.jpg","2024/07/DSC09878.jpg","2024/07/ue-2.jpg"]},{"slug":"mise-en-uvre-de-la-strategie-de-communication","year":"2023-2024","title":"Mise en œuvre de la stratégie de communication du projet MIONJO","family":"communication","desc":"Les missions de HARSON Group consistent à assurer une large diffusion des informations auprès des bénéficiaires et des parties prenantes impliqués au projet. Il s’agit d’une contribution effective au renforcement de la visibilité des actions entreprises dans le cadre du projet au travers des actions ciblées en vue de la sensibilisation et la mobilisation des différents acteurs et contributeurs au projet. Les activités du cabinet couvrent la communication interne et la communication externe avec plusieurs types d’activités notamment de manière non exhaustive, les renforcements de capacité avec team building, la production des outils et supports de communication, la diffusion des supports, la communication digitale.","imgs":["2024/07/Atelier-FAO-3.jpg","2024/07/Atelier-FAO-25.jpg","2024/07/CNP-23-Nov-2023-66.jpg","2024/07/CNP-22fev24-17.jpg","2024/07/CNP-22fev24-36.jpg"]},{"slug":"conception-une-strategie-de-communication-et-de-sensibilisation","year":"2023-2024","title":"Conception d’une stratégie de communication et de sensibilisation comprenant un plan de mise en œuvre pour le compte de GIZ PrAda","family":"strategie","desc":"Pour entretenir une image forte du projet et améliorer sa notoriété, des actions structurées ont été conçues. La stratégie à concevoir se conforme aux orientations de la BMZ, GIZ, du bureau pays tout en tenant en compte de l’approche durable promue par le projet. La valorisation des produits et des compétences locales, la durabilité, le système de production résilient face aux changements climatiques, la structuration au sein des chaînes de valeur restent des notions au cœur des messages à transmettre. Il s’agit de communiquer pour améliorer la visibilité, mieux faire comprendre le projet et renforcer une atmosphère de confiance entre les groupes cibles et le projet.","imgs":["2025/06/prada.jpg","2025/06/giz_logo.jpg"]},{"slug":"elaboration-et-mise-en-uvre-du-plan-de","year":"2022-2023","title":"Élaboration et mise en œuvre du plan de communication du MEN et de la nouvelle Loi d’Orientation de l’Éducation à Madagascar","family":"communication","desc":"HARSON Group a mis en place une stratégie de communication ciblée avec un plan opérationnel de mise en œuvre. Des activités de renforcement de capacité de l’Unité Communication ont été réalisées afin de disposer d’une équipe autonome capable de gérer la mise en œuvre du plan après le désengagement du cabinet. Le plan de communication couvre l’amélioration de la notoriété, l’image et la réputation du MEN en promouvant particulièrement la nouvelle loi d’orientation de l’Éducation à Madagascar (LOSEM). Le cabinet a accompagné la mise en œuvre sur une période de six (6) mois au travers des activités concrètes à savoir l’appui dans la présentation de la loi au niveau de l’A.N, l’élaboration des Éléments de Langage, la gestion des presses, l’organisation d’ateliers, l’élaboration, production et diffusion des supports de communication.","imgs":["2024/07/DSC_0123.jpg","2024/07/DSC_0193.jpg","2024/07/DSC_0216.jpg","2024/07/forum-1.jpg"]},{"slug":"assises-de-la-transformation-digitale-en-afrique-atda","year":"2023","title":"Assises de la Transformation Digitale en Afrique (ATDA) et Conseil des Ministres de l'Alliance Smart Africa","family":"evenementiel","desc":"Harson Group a joué un rôle essentiel en coordonnant avec succès les Assises de la Transformation Digitale en Afrique (ATDA) et en organisant le Conseil des Ministres de l'Alliance Smart Africa, à travers le MNDPT. Grâce à une planification minutieuse, une mise en œuvre efficace du plan de communication, et une gestion logistique impeccable, Harson Group a activement contribué à promouvoir le développement numérique sur le continent africain.","imgs":["2024/07/A7R02947.jpg","2024/07/DSC_3219-2.jpg","2024/07/DSC_3926.jpg","2024/07/DSC_4112.jpg","2024/07/IMG05517.jpg"]},{"slug":"elaboration-de-la-strategie-de-communication-du-projet","year":"2022","title":"Élaboration de la stratégie de communication du projet MIONJO","family":"strategie","desc":"En 2022, Harson Group a été chargé par Mionjo de développer la stratégie de communication pour le projet dans la partie Sud de Madagascar. Harson Group a élaboré une approche complète et ciblée pour atteindre efficacement le public concerné. La stratégie de communication conçue a permis de sensibiliser la population locale, d'engager les parties prenantes clés et de promouvoir les objectifs et initiatives du projet MIONJO.","imgs":["2024/07/DSC_0071-1.jpg","2024/07/DSC_0032.jpg","2024/07/DSC_0066-1.jpg","2024/07/DSC_0080.jpg"]},{"slug":"appui-a-la-communication-du-titiratra-2022","year":"2022","title":"Appui à la communication du TITIRATRA 2022","family":"communication","desc":"Harson Group a contribué dans l’organisation et la communication à travers une couverture médiatique complète de l'événement, capturant chaque moment significatif en photos et vidéos. De plus, Harson Group a joué un rôle crucial dans la conception et la production de supports de communication de haute qualité pour promouvoir l'événement.","imgs":["2024/07/DSC_0017-2.jpg","2024/07/DSC_0062-1.jpg","2024/07/DSC_0078-1.jpg"]},{"slug":"communication-des-plans-amenagement-et-de-gestion-durable","year":"2021-2022","title":"Communication des Plans d'Aménagement et de Gestion Durable des Paysages (PAGDP)","family":"communication","desc":"Harson Group s'est engagé auprès de PADAP pour assurer la communication efficace des Plans d'Aménagement et de Gestion Durable des Paysages. Cela nous a permis de réaliser les synthèses des PAGDP avec une mise en page attrayante, ainsi que d'organiser des ateliers thématiques et des évènements pour sensibiliser les autorités locales et la population. Grâce à leur plaidoyer ciblé, Harson Group a contribué à renforcer l'adoption et la mise en œuvre de ces plans, favorisant ainsi la gestion durable des paysages dans la région concernée.","imgs":["2024/07/Bealalana005.jpg","2024/07/Iazafo-005.jpg","2024/07/Marovoay-001.jpg","2024/07/Soanierana-ivongo-002.jpg"]},{"slug":"mise-a-jour-et-mise-en-uvre-du","year":"2020-2024","title":"Mise à jour et mise en œuvre du plan de communication du projet DAQP III (Lalankely III)","family":"communication","desc":"Pendant les années 2020 à 2023, Harson Group s'est investi dans la mise à jour et la mise en œuvre du plan de communication du projet DAQP III (Lalankely III) en tant qu’agence de communication. Notre rôle a été crucial dans la conception et la diffusion de divers supports de communication tels que des publireportages, spots, affiches, roll-up, X banner, documents de présentation et encarts. De plus, Harson Group a pris en charge l'organisation d'événements et d'ateliers thématiques pour promouvoir activement le projet, renforçant ainsi son impact et son rayonnement auprès des parties prenantes et du public cible.","imgs":["2024/07/lalankely-2.jpg","2024/07/lalankely-6.jpg","2024/07/lalankely-7.jpg","2024/07/lalankely-9.jpg"]},{"slug":"formation-de-formateurs-de-vulgarisateurs-locaux-pour-amelioration","year":"2020","title":"Formation de formateurs de vulgarisateurs locaux pour l'amélioration de la chaîne de valeur Vanille dans la Région Atsimo Atsinanana","family":"accompagnement","desc":"En 2020, Harson Group a joué un rôle central en formant des formateurs de vulgarisateurs locaux pour améliorer la chaîne de valeur de la vanille dans la Région Atsimo Atsinanana, pour le compte de GIZ/PRADA. Le travail a impliqué un diagnostic des pratiques locales, la conception d'outils de formation, et l'organisation d'ateliers et de séances pratiques. En formant les formateurs sur les techniques de culture et de pollinisation de la vanille ainsi que sur la formation d'adultes, Harson Group a contribué à renforcer les compétences des agents vulgarisateurs et à promouvoir des pratiques agricoles durables. De plus, le soutien dans la mise en place de sites vitrines a permis de valoriser les bonnes pratiques agricoles auprès des acteurs clés.","imgs":["2024/07/1.jpg","2024/07/2.jpg","2024/07/3.jpg"]},{"slug":"organisation-de-la-1ere-edition-du-salon-biolojika","year":"2018-2019","title":"Organisation de la 1ère édition du Salon Biolojika 2019","family":"evenementiel","desc":"Harson Group a été le partenaire clé de SYMABIO en 2018-2019 pour la mise en place réussie de la 1ère édition du Salon Biolojika, prévu en 2019. Notre rôle a été essentiel dans l'assistance logistique ainsi que dans l'élaboration et la mise en œuvre du plan de communication et du plan média. Harson Group a assuré la visibilité et la promotion de l'événement, contribuant ainsi à son succès retentissant en tant que salon de référence pour le secteur biologique.","imgs":["2024/07/couv.jpg","2024/07/bio-salon.png","2024/07/salon-biooo.png"]},{"slug":"organisation-du-team-building-de-equipe-du-dgpa","year":"2018-2019","title":"Organisation du team building de l’équipe du DGPA du MAEP à Ampefy","family":"evenementiel","desc":"Harson Group s'est investi en 2018 et 2019 dans l'organisation du team building de l'équipe du DGPA du MAEP à Ampefy. Notre implication comprenait l'animation d'ateliers thématiques, d'activités ludiques et de la soirée de détente. De plus, Harson Group a fourni des fiches techniques détaillées en matière de logistique, couvrant la sonorisation, la projection, la restauration, l'hébergement, ainsi que l'organisation de la salle et des activités ludiques. Grâce à ce travail, l'équipe du DGPA a renforcé la cohésion, la collaboration et la motivation pour une meilleure efficacité dans leurs missions au sein du ministère.","imgs":["2024/07/Maep-Ampefy-27-au-29-juin-2019-by-heeddia-58.jpg","2024/07/Maep-Ampefy-27-au-29-juin-2019-by-heeddia-138.jpg","2024/07/Maep-Ampefy-27-au-29-juin-2019-by-heeddia-148.jpg","2024/07/4.jpg"]},{"slug":"etablissement-des-strategies-de-communication-des-programmes-padeve","year":"2018","title":"Établissement des stratégies de communication des programmes PADEVE et PIAA","family":"strategie","desc":"Harson Group a élaboré une stratégie de communication détaillée ainsi qu'un plan de mise en œuvre opérationnel pour les projets PADEVE et PIAA. Harson Group a également proposé une charte graphique et des supports de communication efficaces pour promouvoir les programmes. De plus, nous avons conçu les Termes de Référence pour la mise en œuvre du plan de communication et pour l'élaboration de certains supports de communication.","imgs":["2024/07/Padeve.jpg"]},{"slug":"organisation-un-dialogue-prive-prive-en-marge-du","year":"2018","title":"Organisation d'un dialogue privé-privé en marge du dialogue politique entre l'Union Européenne et le Gouvernement de Madagascar","family":"promotion","desc":"En 2018, Harson a organisé un dialogue privé-privé et tenu trois réunions préparatoires du secteur privé pour déterminer les thématiques essentielles telles que l'agribusiness, l'exportation, les ports, le transport, le tourisme et les services aux entreprises. Une réunion de réflexion a été suivie d'une restitution en présence de l'Ambassadeur de l'UE et du corps diplomatique des États membres. Nous avons préparé une synthèse des discussions et des recommandations, avec une feuille de route spécifique pour chaque thématique.","imgs":["2024/07/DSCF8548.jpg","2024/07/DSCF8560.jpg","2024/07/DSCF8777.jpg","2024/07/DSCF8903.jpg"]},{"slug":"organisation-de-la-manifestation-commerciale-madagascar-au-trianon","year":"2018","title":"Organisation de la manifestation commerciale « Madagascar au Trianon »","family":"promotion","desc":"Harson a orchestré la manifestation commerciale « Madagascar au Trianon » en l'honneur du 50ème anniversaire des relations entre Madagascar et Maurice. Notre implication a couvert tous les aspects logistiques, tels que l'aménagement des stands d'exposition, l'expédition des produits et l'accompagnement des participants pour l'hébergement et les transferts. Harson a également assuré une gestion efficace des participants et a élaboré un plan de communication stratégique pour Madagascar et Maurice, en incluant la conception de supports de communication percutants comme des affiches, des roll banners, des flyers, des banderoles, ainsi qu'un spot audio.","imgs":["2024/07/trianon-1.jpg","2024/07/trianon-2.jpg","2024/07/trianon-3i.jpg"]},{"slug":"animation-de-la-table-ronde-economique-tre","year":"2018","title":"Animation de la Table Ronde Économique (TRE)","family":"evenementiel","desc":"Harson a animé la Table Ronde Économique (TRE) lors de 3 éditions. Les tâches ont inclus l'organisation et l'animation d'ateliers dynamiques pour favoriser les échanges et les discussions entre les participants. Harson a également réalisé des synthèses concises pour capter les idées et les recommandations clés émises lors des TRE. De plus, nous avons produit des documents de synthèse détaillant les résultats et les actions prioritaires à entreprendre pour stimuler le développement économique.","imgs":["2024/07/TRE.jpg"]},{"slug":"organisation-de-rencontres-b2b-salon-itm-dans-le","year":"2018","title":"Organisation de Rencontres B2B – Salon ITM dans le secteur du tourisme","family":"promotion","desc":"Pour le compte de l’Office National du Tourisme de Madagascar (ONTM), Harson Group a organisé les rencontres B2B durant les Eductours du secteur tourisme en 2018. L’événement a rassemblé 15 000 visiteurs et permis la tenue de 80 rencontres B2B pertinentes. Harson a développé la plateforme d’inscription en ligne, géré les agendas, modéré les échanges, aménagé l’espace B2B, et assuré l’évaluation et le reporting des rencontres.","imgs":["2025/06/ONTM1.png"]},{"slug":"organisation-logistique-visibilite-et-communication-du-seminaire-sur","year":"2017","title":"Organisation logistique, visibilité et communication du séminaire sur les solutions de l'expertise française aux problèmes énergétiques à Madagascar","family":"evenementiel","desc":"En 2017, Harson a organisé le séminaire sur les solutions de l'expertise française aux problèmes énergétiques à Madagascar. Le travail comprenait l'accueil des participants, la gestion de l'atelier, la rédaction de la note de synthèse, la mise en page et l'impression. Nous avons également assuré la communication avec une charte graphique dédiée, un plan média et des outils de communication.","imgs":["2024/07/%C3%A9nergie-1.jpg","2024/07/%C3%A9nergie-2.jpg","2024/07/%C3%A9nergie-3.jpg","2025/06/seminaire.jpg"]},{"slug":"elaboration-de-publireportage-pour-le-projet-lalankely","year":"2014","title":"Élaboration de publireportage pour le projet Lalankely","family":"communication","desc":"Harson s'est impliqué en 2014 dans l'élaboration du publireportage pour le projet Lalankely I. Notre rôle comprenait la conception du script, la prise de vue ainsi que le montage vidéo. Harson Group a créé un publireportage percutant, mettant en valeur les réalisations et les bénéfices du projet Lalankely I.","imgs":["2024/07/lalankely-1.jpg","2024/07/lalankely-2-1.jpg"]},{"slug":"organisation-de-la-conference-interregionale-du-fida","year":"2014","title":"Organisation de la conférence interrégionale du FIDA","family":"evenementiel","desc":"Harson s'est chargé de la préparation minutieuse de la conférence interrégionale du FIDA. Le travail comprenait la synthèse des documents et la gestion de toute la logistique de l'événement. Harson a veillé à la réussite de la conférence, offrant un cadre propice aux échanges constructifs entre les participants et favorisant ainsi le développement et la coopération régionale.","imgs":["2024/07/FIDA-1.jpg","2024/10/IMG_2843.jpg","2024/07/FIDA-2.jpg","2024/07/FIDA-3.jpg"]},{"slug":"organisation-du-congres-malgache-de-la-route-et","year":"2014","title":"Organisation du Congrès Malgache de la Route et des Transports – CMRT","family":"evenementiel","desc":"Harson Group a organisé le Congrès Malgache de la Route et des Transports, pour le compte du Comité Malgache de la Route et des Transports (CMRT). L’équipe a assuré la planification générale, la coordination des activités, la gestion logistique, ainsi que la gestion des passations de marchés. Harson a également animé les travaux de commissions, pris part à la rédaction des résolutions, et géré l’ensemble de la communication et des relations presse, y compris la production des supports de visibilité et des documents de travail.","imgs":["2025/06/CONGRES2.jpg","2025/06/CONGRES1.jpg"]},{"slug":"organisation-de-la-journee-du-petrole-amont","year":"2012","title":"Organisation de la journée du Pétrole amont","family":"evenementiel","desc":"En 2012, Harson Group a organisé la journée du Pétrole amont. Le travail comprenait la gestion logistique, la communication avec un plan complet, l'aménagement, la décoration, l'installation du matériel, l'interprétariat, les scribes, la synthèse et la rédaction de la résolution. Ils ont également géré les invitations, le plan média, les articles, les kits participants, badges, banderoles, X banners, oriflammes, affichettes et la gestion administrative. Une évaluation a été faite pour améliorer les futurs événements.","imgs":["2024/07/pet-4.jpg","2024/07/pet-2.jpg","2024/07/pet-3.jpg","2024/07/pet-5.jpg","2024/10/15.jpg"]},{"slug":"organisation-de-la-conference-regionale-des-groupements-entreprises","year":"2012","title":"Organisation de la Conférence Régionale des Groupements d’Entreprises de l’Océan Indien","family":"evenementiel","desc":"Harson Group a organisé la Conférence Régionale des Groupements d’Entreprises de l’Océan Indien. L’événement, initié par CAPDEV, a réuni 150 invités issus de Madagascar, des Comores, de Maurice, de La Réunion et de Mayotte, avec plus de 60 rencontres B2B pertinentes. Harson a assuré la planification générale, la logistique, l’organisation des pavillons en side event, l’appui aux conférences et panels, la communication, l’animation et la modération, ainsi que la gestion technique et le reporting post-événement.","imgs":["2025/06/capdev.png"]},{"slug":"organisation-un-evenement-b2b-pour-cap-dev","year":"2011","title":"Organisation d’un événement B2B pour CAP DEV","family":"promotion","desc":"En 2011, Harson Group a organisé un événement B2B pour CAP DEV Madagascar. Lors de cet événement, Harson Group a géré la logistique, la communication, l'aménagement des lieux, l'installation des divers matériels, l'interprétariat et le secrétariat.","imgs":["2024/07/capdev-3.jpg","2024/07/capdev-1.jpg","2024/07/capdev-2.jpg"]},{"slug":"organisation-de-la-manifestation-madagascar-au-caudan-ile","year":"2008-2016","title":"Organisation de la manifestation « Madagascar au Caudan » – Île Maurice","family":"promotion","desc":"Harson Group a organisé les cinq éditions de l’événement commercial « Madagascar au Caudan » à l’Île Maurice, en collaboration avec l’Ambassade de Madagascar. La 4e édition en 2015 a réuni en moyenne 3 500 visiteurs, avec 60 rencontres B2B pertinentes et entre 25 à 55 participants internationaux. Harson a pris en charge la logistique d’expédition des produits depuis Madagascar, la gestion des hébergements, l’organisation des rencontres B2B, la communication bilatérale (Madagascar/Maurice), les animations, la gestion technique, ainsi que le suivi, le reporting et l’évaluation. L’équipe a également rédigé et produit les dossiers de sponsoring et conduit les recherches de financement pour la réussite des éditions.","imgs":["2025/06/caudan-3.jpg","2025/06/caudan1-3.jpg","2025/06/CAUDAN2-3.jpg","2025/06/caudan3-3.jpg","2025/06/caudan4-2.jpg","2025/06/caudan5-2.jpg","2025/06/caudan6-2.jpg","2025/06/caudan7-2.jpg"]}]`)})),Yn,Xn,Zn,Qn,$n,er,tr,nr,rr,ir,ar,or,sr,cr,lr=t((()=>{Jn(),Yn=`./images/`,Xn=e=>Yn+e,Zn=Xn(`logo-harson.svg`),Qn=Xn(`logo-harson-blanc.png`),Xn(`logo-harson-noir.png`),$n=[{to:`/`,label:`Accueil`},{to:`/expertises`,label:`Nos expertises`},{to:`/realisations`,label:`Nos réalisations`},{to:`/a-propos`,label:`À propos`},{to:`/conta
